<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="asphalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="holeDepth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="85%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </radialGradient>
  </defs>
  <!-- Asphalt Road Background -->
  <rect width="600" height="400" fill="url(#asphalt)"/>
  
  <!-- Road Lane Marking -->
  <rect x="280" y="20" width="40" height="100" fill="#facc15" opacity="0.8"/>
  <rect x="280" y="280" width="40" height="100" fill="#facc15" opacity="0.8"/>
  
  <!-- Outer Crack Ring -->
  <path d="M 180 180 Q 220 120 340 140 T 460 210 Q 440 280 320 290 T 170 230 Z" fill="#1f2937" stroke="#64748b" stroke-width="4"/>
  
  <!-- Deep Pothole Cavity -->
  <ellipse cx="310" cy="210" rx="130" ry="75" fill="url(#holeDepth)"/>
  
  <!-- Water / Mud Reflection inside cavity -->
  <ellipse cx="320" cy="225" rx="75" ry="35" fill="#1e3a8a" opacity="0.5"/>
  <ellipse cx="315" cy="220" rx="40" ry="18" fill="#38bdf8" opacity="0.3"/>
  
  <!-- Surrounding Cracks -->
  <path d="M 180 180 L 120 150 M 140 190 L 90 220 M 460 210 L 520 180 M 430 260 L 510 300 M 240 130 L 220 80 M 350 290 L 370 350" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- AI Detection Bounding Box Overlay -->
  <rect x="150" y="110" width="340" height="200" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="150" y="80" width="180" height="30" fill="#ef4444" rx="4"/>
  <text x="160" y="100" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14">POTHOLE: 96.4% (HIGH)</text>
</svg>
