<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background pavement & boundary wall -->
  <rect width="600" height="220" fill="url(#wall)"/>
  <rect y="220" width="600" height="180" fill="url(#ground)"/>
  
  <!-- Green Municipal Dumpster overflowing -->
  <path d="M 120 180 L 260 180 L 250 320 L 130 320 Z" fill="#047857" stroke="#065f46" stroke-width="4"/>
  <rect x="110" y="165" width="160" height="18" rx="4" fill="#065f46"/>
  <text x="140" y="250" fill="#a7f3d0" font-family="Arial, sans-serif" font-weight="bold" font-size="16">SMART WASTE</text>
  
  <!-- Garbage Heap -->
  <path d="M 220 330 C 260 220, 360 200, 420 250 C 470 230, 520 280, 500 350 Z" fill="#78350f" opacity="0.9"/>
  <!-- Plastic bags and wrappers -->
  <path d="M 270 290 Q 300 250 330 280 T 360 300 Z" fill="#38bdf8"/>
  <path d="M 340 260 Q 370 230 400 250 T 420 280 Z" fill="#facc15"/>
  <path d="M 380 290 Q 420 270 450 300 T 480 320 Z" fill="#ef4444"/>
  <path d="M 290 320 Q 330 310 360 340 Z" fill="#ec4899"/>
  <circle cx="310" cy="270" r="14" fill="#10b981"/>
  <rect x="370" y="320" width="45" height="25" fill="#f97316" rx="3"/>
  <ellipse cx="430" cy="330" rx="35" ry="15" fill="#64748b"/>
  
  <!-- AI Detection Box Overlay -->
  <rect x="210" y="200" width="310" height="160" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="210" y="170" width="220" height="30" fill="#f59e0b" rx="4"/>
  <text x="220" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14">GARBAGE ACCUMULATION: 94.8%</text>
</svg>
